<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ComfyUI · MiniMax H3</title>
<style>
  :root{--bg:#0f1115;--fg:#e8e8ea;--muted:#8a8f98;--acc:#7c5cff;--ok:#2ecc71;--bad:#ff5c5c;--card:#171a21;--br:#262b35}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:12px;padding-bottom:40px}
  h1{font-size:18px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;background:#0b0d12;color:var(--fg);border:1px solid var(--br);border-radius:10px;padding:10px;font-size:15px;outline:none}
  textarea{min-height:110px;resize:vertical;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  button{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
  button:disabled{opacity:.4;cursor:not-allowed;background:#555}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:50%;background:#666;flex-shrink:0}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .dot.wait{background:#f1c40f;box-shadow:0 0 8px #f1c40f;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  
  /* === ПРОГРЕСС БАРЫ === */
  .progress-box{display:none;background:linear-gradient(135deg,#12151c,#1a1e2a);border:2px solid var(--acc);border-radius:16px;padding:16px;margin-top:12px}
  .progress-box.active{display:block}
  .progress-box.done{border-color:var(--ok)}
  .progress-box.error{border-color:var(--bad)}
  
  .stage-row{margin-bottom:14px}
  .stage-row:last-child{margin-bottom:0}
  .stage-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .stage-name{font-size:14px;font-weight:600;color:var(--fg)}
  .stage-pct{font-size:14px;font-weight:700;color:var(--acc)}
  .progress-box.done .stage-pct{color:var(--ok)}
  .progress-box.error .stage-pct{color:var(--bad)}
  
  .bar-bg{width:100%;height:8px;background:#262b35;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#a78bfa);border-radius:4px;transition:width .3s ease}
  .progress-box.done .bar-fill{background:var(--ok)}
  .progress-box.error .bar-fill{background:var(--bad)}
  
  .stage-time{font-size:12px;color:var(--muted);margin-top:4px;text-align:right}
  .p-status{font-size:13px;color:var(--muted);margin-top:12px;text-align:center;border-top:1px solid var(--br);padding-top:10px}

  /* === РЕЗУЛЬТАТ === */
  video{width:100%;border-radius:10px;background:#000;margin-top:8px}
  .dl-btn{display:block;text-align:center;background:var(--ok);color:#fff;text-decoration:none;padding:12px;border-radius:10px;margin-top:8px;font-weight:600;font-size:16px}
  .tip{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
</style>
</head>
<body>
<h1>ComfyUI · MiniMax H3 (10s max)</h1>

<div class="card">
  <div class="status"><span class="dot" id="dot"></span><span id="status">отключено</span></div>
  <label>Адрес сервера</label>
  <input id="url" value="http://192.168.1.103:8188">
  <button id="btnConnect">Подключить</button>
</div>

<div class="card">
  <label>Промпт</label>
  <textarea id="prompt" placeholder="Описание видео..."></textarea>
  <div class="grid2">
    <div><label>Ширина</label><input id="width" type="number" value="896"></div>
    <div><label>Высота</label><input id="height" type="number" value="576"></div>
  </div>
  <div class="grid2">
    <div>
      <label>Ориентация натуралов</label>
      <select id="aspect">
        <option value="16:9 (Widescreen)">16:9</option>
        <option value="9:16 (Portrait Widescreen)">9:16</option>
        <option value="1:1 (Square)">1:1</option>
        <option value="4:3 (Standard)">4:3</option>
        <option value="3:4 (Portrait Standard)">3:4</option>
        <option value="21:9 (Ultra-Widescreen)">21:9</option>
      </select>
    </div>
    <div><label>Качество в пикселях (чем больше, тем лучше, но дольше пздц прям. Лучше не трогать, родной)</label><input id="mp" type="number" step="0.05" value="0.2"></div>
  </div>
  <label>Длительность клипа (макс 10сек иначе комп умрёт)</label>
  <input id="duration" type="number" value="1">
  <button id="btnQueue">🎬 Сгенерировать ШЕДЕВР!!!</button>

  <div class="progress-box" id="pbox">
    <!-- Полоса 1: Подготовка -->
    <div class="stage-row" id="stage-prep" style="display:none">
      <div class="stage-header"><span class="stage-name">⚙️ Подготовка и промпт</span><span class="stage-pct" id="pct-prep">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-prep"></div></div>
    </div>
    <!-- Полоса 2: Генерация -->
    <div class="stage-row" id="stage-gen" style="display:none">
      <div class="stage-header"><span class="stage-name">🎨 Генерация видео</span><span class="stage-pct" id="pct-gen">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-gen"></div></div>
      <div class="stage-time" id="time-gen"></div>
    </div>
    <!-- Полоса 3: Декодирование -->
    <div class="stage-row" id="stage-decode" style="display:none">
      <div class="stage-header"><span class="stage-name">🎬 Декодирование и сохранение</span><span class="stage-pct" id="pct-decode">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-decode"></div></div>
    </div>
    <div class="p-status" id="pstatus">ожидание запуска...</div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none">
  <label>✅ Результат</label>
  <video id="videoPlayer" controls playsinline webkit-playsinline></video>
  <a id="downloadBtn" class="dl-btn" href="#" target="_blank" download>💾 Скачать видео</a>
  <div class="tip">iPhone: удерживай палец на видео → «Сохранить в Файлы»</div>
</div>

<script>
const WF={"144":{"inputs":{"lora_name":"minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors","strength_model":1,"model":["206:141",0]},"class_type":"LoraLoaderModelOnly","_meta":{"title":"H3 Turbo LoRA"}},"148":{"inputs":{"run_mode":"clip_by_clip","width":896,"height":576,"ref_image_size":"match","steps":4,"sampler_name":"euler","scheduler":"simple","denoise":1,"context_length":"22","audio_context_length":0,"clips_json":"{\"version\":1,\"clips\":[{\"id\":\"clip_1\",\"name\":\"\",\"prompt\":\"\",\"seed\":4327168659951150,\"seed_mode\":\"randomize\",\"duration\":10,\"validated\":false,\"color_adjustment\":{\"saturation\":100,\"contrast\":100,\"brightness\":100}}]}","resolution_mode":"auto_from_ref","megapixels":0.2,"refs_json":"{\"version\":2,\"refs\":[null,null,null,null,null,null,null,null,null]}","model":["144",0],"clip":["202:207:201:142",0],"vae":["202:207:201:143",0],"audio_vae":["203:179",0]},"class_type":"MiniMaxH3Extender","_meta":{"title":"MiniMax H3 Extender"}},"149":{"inputs":{"fps":24,"filename_prefix":"MiniMax_H3_cached","output_directory":"","codec":"H.264","crf":17,"preset":"fast","audio_bitrate":"192k","cache":["148",0],"vae":["202:207:201:143",0],"audio_vae":["203:179",0]},"class_type":"MiniMaxH3MotionContextDiskFinalDecode","_meta":{"title":"Final Decode"}},"203:178":{"inputs":{"vae_name":"minimax_h3_video_vae_fp16.safetensors"},"class_type":"VAELoader","_meta":{"title":"Load VAE"}},"203:179":{"inputs":{"vae_name":"minimax_h3_audio_vae_fp32.safetensors"},"class_type":"VAELoader","_meta":{"title":"Load VAE"}},"206:141":{"inputs":{"unet_name":"minimax_h3_fl2va_pruned_int8_convrot.safetensors","weight_dtype":"default"},"class_type":"UNETLoader","_meta":{"title":"H3 Model"}},"206:192":{"inputs":{"value":2},"class_type":"PrimitiveFloat","_meta":{"title":"Float"}},"206:205:204:191":{"inputs":{"expression":"max(5, round(a * 24)) + (5 - (max(5, round(a * 24)) % 17)) % 17","values.a":["206:192",0]},"class_type":"ComfyMathExpression","_meta":{"title":"M const $=id=>document.getElementById(id);
const dot=$('dot'),st=$('status'),btnQ=$('btnQueue');
const pbox=$('pbox'),pstatus=$('pstatus');
let ws=null,busy=false,clientId=localStorage.getItem('cid')||('m_'+Math.random().toString(36).slice(2,10));
localStorage.setItem('cid',clientId);

// Карта узлов по этапам
const nodeToStage={};
for(const[id,data]of Object.entries(WF)){
  const ct=data.class_type.toLowerCase();
  if(ct.includes('sampler'))nodeToStage[id]='gen';
  else if(ct.includes('vae')||ct.includes('decode')||ct.includes('video')||ct.includes('final'))nodeToStage[id]='decode';
  else nodeToStage[id]='prep';
}

const stages={
  prep:{active:false,val:0,max:1,start:0},
  gen:{active:false,val:0,max:1,start:0},
  decode:{active:false,val:0,max:1,start:0}
};

function setStatus(s,c){st.textContent=s;dot.className='dot '+c}
function setBusy(v){busy=v;btnQ.disabled=v;btnQ.textContent=v?'⏳ Генерация...':'🎬 Поставить в очередь'}
function fmtTime(sec){if(!isFinite(sec)||sec<0)return'расчёт...';const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s}

function updateStageUI(stage){
  const s=stages[stage];
  const row=$('stage-'+stage);
  const pctEl=$('pct-'+stage);
  const barEl=$('bar-'+stage);
  
  row.style.display='block';
  const pctVal=s.max>0?Math.round(s.val/s.max*100):0;
  pctEl.textContent=pctVal+'%';
  barEl.style.width=pctVal+'%';
  
  if(stage==='gen' && s.val>0){
    const now=Date.now();
    const elapsed=(now-s.start)/1000;
    const pct=s.val/s.max;
    if(pct>0.05){
      const total=elapsed/pct;
      const rem=total-elapsed;
      $('time-gen').textContent='осталось ≈ '+fmtTime(rem);
    }
  }
}

function finishProgress(ok,msg){
  pbox.className='progress-box active '+(ok?'done':'error');
  pstatus.textContent=ok?'✅ Генерация завершена! Получаю файл...':'❌ '+msg;
  setBusy(false);
}

/* === ПОДКЛЮЧЕНИЕ === */
$('btnConnect').onclick=async()=>{
  const base=$('url').value.trim().replace(/\/+$/,'');
  if(!base)return;
  setStatus('подключение...','wait');
  try{const r=await fetch(base+'/system_stats');if(!r.ok)throw 0}
  catch(e){setStatus('сервер недоступен','bad');return}
  const wsUrl=base.replace(/^http/,'ws')+'/ws?clientId='+clientId;
  if(ws)ws.close();
  ws=new WebSocket(wsUrl);
  ws.onopen=()=>setStatus('подключено','ok');
  ws.onclose=()=>setStatus('отключено','');
  ws.onerror=()=>setStatus('ошибка WS','bad');
  ws.onmessage=ev=>{
    try{
      const m=JSON.parse(ev.data);
      if(!busy)return;
      
      if(m.type==='executing'){
        const nodeId=m.data.node;
        if(nodeId){
          const stage=nodeToStage[nodeId]||'gen';
          stages[stage].active=true;
          stages[stage].start=Date.now();
          stages[stage].val=0;
          stages[stage].max=1;
          updateStageUI(stage);
        }
      }
      else if(m.type==='progress'){
        const nodeId=m.data.node;
        const stage=nodeId?(nodeToStage[nodeId]||'gen'):'gen';
        stages[stage].val=m.data.value;
        stages[stage].max=m.data.max;
        updateStageUI(stage);
      }
      else if(m.type==='execution_success'){
        finishProgress(true,'');
        fetchHistory(m.data.prompt_id);
      }
      else if(m.type==='execution_error'){
        finishProgress(false,m.data.exception_message||'ошибка генерации');
      }
    }catch(e){}
  };
};

/* === УНИВЕРСАЛЬНЫЙ ПОИСК ФАЙЛА === */
function collectFiles(obj,out=[]){
  if(!obj||typeof obj!=='object')return out;
  if(Array.isArray(obj)){obj.forEach(x=>collectFiles(x,out));return out}
  if(obj.filename&&typeof obj.filename==='string'){
    const ext=obj.filename.split('.').pop().toLowerCase();
    if(['mp4','webm','mov','avi','mkv','gif','png','jpg','jpeg','wav','mp3','m4a'].includes(ext))out.push(obj);
  }
  for(const k in obj)collectFiles(obj[k],out);
  return out;
}

async function tryViewUrl(base,file){
  const types=['output','temp','input'];
  const tryType=file.type&&types.includes(file.type)?[file.type]:types;
  for(const t of tryType){
    const q=new URLSearchParams({filename:file.filename,type:t,subfolder:file.subfolder||''}).toString();
    const url=base+'/view?'+q;
    try{const r=await fetch(url,{method:'HEAD'});if(r.ok)return url}catch(e){}
  }
  return null;
}

async function fetchHistory(promptId){
  const base=$('url').value.trim().replace(/\/+$/,'');
  try{
    const r=await fetch(base+'/history/'+promptId);
    const data=await r.json();
    const hist=data[promptId];
    if(!hist){finishProgress(false,'нет в истории');return}
    let files=[];
    if(hist.outputs)files=collectFiles(hist.outputs);
    if(!files.length)files=collectFiles(hist);
    const videoExts=['mp4','webm','mov'];
    files.sort((a,b)=>{
      const ea=a.filename.split('.').pop().toLowerCase();
      const eb=b.filename.split('.').pop().toLowerCase();
      return(videoExts.includes(eb)?1:0)-(videoExts.includes(ea)?1:0);
    });
    for(const f of files){
      const url=await tryViewUrl(base,f);
      if(url){
        $('resultCard').style.display='block';
        $('videoPlayer').src=url;
        $('downloadBtn').href=url;
        $('resultCard').scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
    }
    finishProgress(false,'файл не найден через /view');
  }catch(e){finishProgress(false,'ошибка: '+e.message)}
}

/* === ОТПРАВКА === */
btnQ.onclick=async()=>{
  if(busy)return;
  const base=$('url').value.trim().replace(/\/+$/,'');
  if(!ws||ws.readyState!==1){alert('Сначала подключись');return}
  
  // Сброс прогресса
  stages.prep={active:false,val:0,max:1,start:0};
  stages.gen={active:false,val:0,max:1,start:0};
  stages.decode={active:false,val:0,max:1,start:0};
  $('stage-prep').style.display='none';
  $('stage-gen').style.display='none';
  $('stage-decode').style.display='none';
  $('time-gen').textContent='';
  
  const wf=JSON.parse(JSON.stringify(WF));
  const prompt=$('prompt').value;
  const w=+$('width').value,h=+$('height').value;
  const mp=+$('mp').value,dur=+$('duration').value;
  const aspect=$('aspect').value;
  
  wf['148'].inputs.width=w;wf['148'].inputs.height=h;wf['148'].inputs.megapixels=mp;
  const clips=JSON.parse(wf['148'].inputs.clips_json);
  clips.clips[0].prompt=prompt;clips.clips[0].duration=dur;clips.clips[0].seed=Math.floor(Math.random()*9e15);
  wf['148'].inputs.clips_json=JSON.stringify(clips);
  wf['202:207:201:115'].inputs.aspect_ratio=aspect;wf['202:207:201:115'].inputs.megapixels=mp;
  wf['202:207:201:200'].inputs.prompt=prompt;
  
  $('resultCard').style.display='none';
  pbox.className='progress-box active';
  pstatus.textContent='отправка задания...';
  setBusy(true);
  
  try{
    const r=await fetch(base+'/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:wf,client_id:clientId})});
    const j=await r.json();
    if(!j.prompt_id){finishProgress(false,'сервер отклонил');return}
    pstatus.textContent='задание в очереди, ожидание старта...';
  }catch(e){finishProgress(false,e.message)}
};
</script>
</body>
</html>
